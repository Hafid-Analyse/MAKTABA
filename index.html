<style>
/* Soft UI — ضباب أزرق رمادي، بطاقات بيضاء بانحناءات كبيرة، تدرجات لونية مضيئة */
:root{
  --bg:#e7ecf3; --bg-2:#f4f7fb; --card:#ffffff; --soft:#f1f4f9; --ink:#172033; --muted:#8a94a7; --line:#e4e9f1;
  --blue-1:#5cb8ff; --blue-2:#2d7cff; --violet-1:#b06bff; --violet-2:#7a2cf2;
  --green-1:#55e58a; --green-2:#1cbf57; --sun-1:#ffbe4d; --sun-2:#ff6a3d; --cyan:#27d3c3; --rose:#ff5f7e;
  --sh-lg:0 30px 60px -28px rgba(66,88,130,.45),0 6px 14px -6px rgba(66,88,130,.12);
  --sh-md:0 16px 32px -18px rgba(66,88,130,.45),0 2px 6px rgba(66,88,130,.06);
  --sh-in:inset 0 2px 6px rgba(66,88,130,.10),inset 0 -1px 0 rgba(255,255,255,.9);
  --hi:inset 0 1px 0 rgba(255,255,255,.9);
  --r-xl:34px; --r-lg:26px; --r-md:20px;
  --font:"Readex Pro","Tajawal",system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f141e; --bg-2:#151c29; --card:#1b2333; --soft:#151c29; --ink:#eef2f9; --muted:#8692a8; --line:#283246;
  --sh-lg:0 30px 60px -26px rgba(0,0,0,.75),0 6px 14px -6px rgba(0,0,0,.4);
  --sh-md:0 16px 32px -16px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.3);
  --sh-in:inset 0 2px 8px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.04);
  --hi:inset 0 1px 0 rgba(255,255,255,.06);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.55;
  background:radial-gradient(120% 70% at 80% -10%,var(--bg-2),transparent 60%),var(--bg);background-attachment:fixed;transition:background .4s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.app{max-width:780px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 150px max(18px,env(safe-area-inset-left,0px))}

/* ===== الرأس ===== */
.hdr{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.avatar{width:54px;height:54px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh-md),var(--hi);display:grid;place-items:center;position:relative;font-weight:700;font-size:20px;color:var(--blue-2)}
.avatar .plus{position:absolute;bottom:-2px;left:-2px;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--blue-1),var(--blue-2));color:#fff;display:grid;place-items:center;font-size:14px;line-height:1;border:2px solid var(--card)}
.hdr .tx{flex:1;min-width:0}
.hdr h1{margin:0;font-size:22px;font-weight:600;line-height:1.3}
.hdr h1 b{font-weight:700}
.hdr p{margin:0;color:var(--muted);font-size:13px}
.orb{width:54px;height:54px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh-md),var(--hi);display:grid;place-items:center;position:relative;overflow:hidden}
.orb i{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe08a,var(--sun-1) 40%,var(--sun-2));box-shadow:0 0 18px 4px rgba(255,138,61,.45);transition:transform .5s cubic-bezier(.5,1.6,.4,1),background .4s,box-shadow .4s}
:root[data-theme="dark"] .orb i{background:radial-gradient(circle at 65% 35%,transparent 38%,#c9b8ff 40%,#8f6bff 75%);box-shadow:0 0 18px 4px rgba(143,107,255,.45);transform:rotate(-30deg)}

/* ===== بلاطات التصفية ===== */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.tile{border:0;border-radius:var(--r-lg);background:var(--card);box-shadow:var(--sh-md),var(--hi);padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s,box-shadow .2s}
.tile:active{transform:scale(.97)}
.tile .ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--c2);color:var(--c2);background:color-mix(in srgb,var(--c1) 12%,transparent);box-shadow:0 0 0 5px color-mix(in srgb,var(--c1) 10%,transparent)}
.tile b{font-weight:600;font-size:15px}
.tile small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.tile[aria-pressed="true"]{background:linear-gradient(150deg,var(--c1),var(--c2));color:#fff;box-shadow:0 18px 30px -14px var(--c2),var(--hi)}
.tile[aria-pressed="true"] .ring{border-color:rgba(255,255,255,.8);color:#fff;background:rgba(255,255,255,.18);box-shadow:0 0 0 5px rgba(255,255,255,.12)}
.tile[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.c-blue{--c1:var(--blue-1);--c2:var(--blue-2)} .c-violet{--c1:var(--violet-1);--c2:var(--violet-2)}
.c-sun{--c1:var(--sun-1);--c2:var(--sun-2)} .c-green{--c1:var(--green-1);--c2:var(--green-2)}

/* ===== القرص (الثرموستات) ===== */
.dialcard{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--sh-lg),var(--hi);padding:40px 18px 18px;position:relative;margin-bottom:18px}
.dialcard .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--soft);color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.6px;padding:4px 18px 6px;border-radius:0 0 16px 16px;box-shadow:var(--sh-in)}
.dial{position:relative;width:min(260px,72vw);aspect-ratio:1;margin:8px auto 0}
.dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial .tick{stroke:var(--muted);opacity:.45;stroke-width:1.6;stroke-linecap:round}
.dial .tick.big{opacity:.9;stroke-width:2.2}
.dial .lbl{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--font)}
.dial .track{stroke:var(--soft);fill:none}
.dial .face{position:absolute;inset:23%;border-radius:50%;background:var(--card);
  box-shadow:0 0 0 12px color-mix(in srgb,var(--bg) 70%,var(--card)),0 18px 36px -12px rgba(66,88,130,.45),inset 0 -6px 14px rgba(66,88,130,.08);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
:root[data-theme="dark"] .dial .face{box-shadow:0 0 0 12px #121927,0 18px 36px -12px rgba(0,0,0,.8),inset 0 -6px 14px rgba(0,0,0,.3)}
.dial .face b{font-size:clamp(36px,11vw,50px);font-weight:600;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.dial .face b sup{font-size:.42em;font-weight:500;margin-inline-start:2px}
.dial .face span{color:var(--muted);font-size:13px;margin-top:4px}
.dialrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;margin-top:6px;gap:8px}
.big{font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:14px;color:var(--muted);font-weight:500;margin-inline-start:4px}
.dialrow .lab{color:var(--muted);font-size:12.5px}
.dialrow .end{text-align:end}
.pillsoft{background:var(--soft);box-shadow:var(--sh-in);color:var(--muted);border-radius:999px;padding:5px 14px;font-size:12.5px;font-weight:500;white-space:nowrap;align-self:center}
.strip{display:flex;justify-content:space-around;gap:6px;margin:14px -6px 0;padding:12px 6px 4px;border-top:1px dashed var(--line)}
.strip div{text-align:center}
.strip b{display:block;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.strip span{font-size:11.5px;color:var(--muted)}

/* ===== البحث ===== */
.searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;box-shadow:var(--sh-md),var(--hi);padding:6px 6px 6px 8px;padding-inline-start:18px}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;outline:none}
.searchbar .ico{color:var(--muted)}
.roundbtn{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--blue-1),var(--blue-2));box-shadow:0 10px 18px -8px var(--blue-2)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;border:0;border-radius:999px;padding:7px 16px;font-size:13px;font-weight:500;background:var(--soft);color:var(--muted);box-shadow:var(--sh-in)}
.cat[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh-md),var(--hi);font-weight:600}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 4px 10px}
.sechead h2{margin:0;font-size:19px;font-weight:600}
.sechead h2 em{font-style:normal;background:linear-gradient(90deg,var(--sun-1),var(--sun-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sechead span{color:var(--muted);font-size:13px}

/* ===== بطاقات الكتب ===== */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.bk{border:0;text-align:center;border-radius:var(--r-lg);background:var(--card);box-shadow:var(--sh-md),var(--hi);padding:12px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;transition:transform .2s}
.bk:active{transform:scale(.97)}
.bk .top{align-self:stretch;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.3px}
.tog{width:36px;height:20px;border-radius:999px;background:var(--soft);box-shadow:var(--sh-in);position:relative;flex:0 0 auto}
.tog::after{content:"";position:absolute;top:3px;right:3px;width:14px;height:14px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:right .25s}
.tog.on{background:rgba(255,255,255,.35)} .tog.on::after{right:19px;background:#fff}
.bk .ic{width:52px;height:52px;margin-top:4px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--c2);color:var(--c2);font-weight:700;font-size:20px;background:color-mix(in srgb,var(--c1) 12%,transparent);box-shadow:0 0 0 6px color-mix(in srgb,var(--c1) 9%,transparent)}
.bk .t{font-weight:600;font-size:14.5px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;width:100%}
.bk .m{font-size:11.5px;color:var(--muted);width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{font-family:ui-monospace,Menlo,monospace;direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-size:11.5px;font-weight:700;letter-spacing:.3px}
.bk.lent{background:linear-gradient(155deg,var(--violet-1),var(--violet-2));color:#fff;box-shadow:0 22px 34px -16px var(--violet-2),var(--hi)}
.bk.lent .top,.bk.lent .m{color:rgba(255,255,255,.82)}
.bk.lent .ic{border-color:rgba(255,255,255,.85);color:#fff;background:rgba(255,255,255,.16);box-shadow:0 0 0 6px rgba(255,255,255,.1)}
.bk.warn .top{color:var(--sun-2)}

/* ===== حالات ===== */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:4px 12px;background:var(--soft);box-shadow:var(--sh-in)}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--d)}
.st-متوفر{--d:var(--green-2)} .st-معار{--d:var(--violet-2)} .st-تالف{--d:var(--sun-2)} .st-مفقود{--d:var(--muted)}
.empty{text-align:center;color:var(--muted);background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-md);padding:34px 18px}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:4px}

/* ===== في الخارج: حلقات الوقت ===== */
.loans{display:flex;flex-direction:column;gap:12px}
.loan{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-md),var(--hi);padding:12px 14px}
.loan .clock{position:relative;width:62px;height:62px;flex:0 0 auto}
.loan .clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.loan .clock div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.loan .clock b{font-size:18px;font-weight:600}
.loan .clock span{font-size:9.5px;color:var(--muted);margin-top:2px}
.loan .tx{flex:1;min-width:0}
.loan .tx b{font-weight:600}
.loan .tx p{margin:2px 0 0;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.loan.late .clock b{color:var(--sun-2)}

/* ===== أزرار ===== */
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#fff;
  background:linear-gradient(135deg,var(--c1,var(--blue-1)),var(--c2,var(--blue-2)));box-shadow:0 14px 24px -12px var(--c2,var(--blue-2)),var(--hi)}
.btn .ico{width:18px;height:18px}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:var(--sh-md),var(--hi)}
.btn.flat{background:var(--soft);color:var(--muted);box-shadow:var(--sh-in)}
.btn.sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.5}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* ===== الشريط السفلي (Dock) ===== */
.dock{position:fixed;inset:auto 0 0 0;z-index:10;display:flex;justify-content:center;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.dock .bar{pointer-events:auto;position:relative;width:100%;max-width:520px;height:76px;border-radius:30px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:var(--sh-lg),var(--hi);display:grid;grid-template-columns:1fr 1fr 96px 1fr 1fr;align-items:center;justify-items:center}
.dk{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:500;padding:6px 4px;border-radius:18px;min-width:56px}
.dk .bub{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:all .25s}
.dk[aria-current="true"]{color:var(--ink)}
.dk[aria-current="true"] .bub{background:var(--card);box-shadow:var(--sh-md),var(--hi);color:var(--blue-2)}
.dk[hidden]{visibility:hidden;display:flex}
.dock[hidden]{display:none}
.avatar[hidden]{display:none}
.fc .back .reqbtn{margin-top:auto;border:0;border-radius:999px;padding:8px 10px;font-size:12.5px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 10px 18px -10px var(--c2)}
.fc .back .foot{margin-top:6px}
.done{text-align:center;padding:10px 4px 4px}
.done .ok{width:84px;height:84px;margin:6px auto 14px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:40px;background:linear-gradient(135deg,var(--green-1),var(--green-2));box-shadow:0 18px 30px -14px var(--green-2),0 0 0 10px color-mix(in srgb,var(--green-1) 15%,transparent)}
.done h2{margin:0 0 6px;font-size:22px;font-weight:600}
.done p{margin:0 auto;max-width:34ch;color:var(--muted)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.req{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-md),var(--hi);padding:14px}
.req .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.req .hd b{font-weight:600}
.req p{margin:4px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.rs{font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 10px;color:#fff;white-space:nowrap;background:linear-gradient(135deg,var(--c1),var(--c2))}
.tile .cnt{position:absolute;top:8px;left:8px;min-width:22px;height:22px;border-radius:11px;padding:0 6px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--sun-1),var(--sun-2))}
.tile{position:relative}
.scanfab{position:relative;grid-column:3;grid-row:1;margin-top:-34px;width:84px;height:84px;border-radius:50%;border:0;background:var(--card);
  box-shadow:0 0 0 8px color-mix(in srgb,var(--bg) 85%,transparent),var(--sh-lg),var(--hi);display:grid;place-items:center}
.scanfab .ico{width:34px;height:34px;stroke:url(#gSun);stroke-width:2}
.scanfab span{position:absolute;bottom:-22px;font-size:10.5px;color:var(--muted);white-space:nowrap;font-weight:500}
.scanfab::before{content:"";position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--sun-1) 18%,transparent),transparent 70%)}

/* ===== الصفحة المنبثقة ===== */
.scrim{position:fixed;inset:0;background:rgba(20,28,45,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:20;animation:fade .2s}
.sheet{position:fixed;inset:auto 0 0 0;z-index:21;max-width:780px;margin:0 auto;max-height:90vh;overflow-y:auto;background:var(--bg-2);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:0 -20px 50px -20px rgba(0,0,0,.35);
  padding:12px max(20px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:sheetIn .42s cubic-bezier(.22,1,.36,1);
  transition:transform .34s cubic-bezier(.22,1,.36,1);will-change:transform;overscroll-behavior:contain}
:root[data-theme="dark"] .sheet{background:var(--bg-2)}
.grab{width:46px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@keyframes rise{from{transform:translateY(14px);opacity:0}} @keyframes fade{from{opacity:0}}
@keyframes sheetIn{from{transform:translateY(100%)}} @keyframes toastIn{from{transform:translate(-50%,16px);opacity:0}}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}}
.sheet.dragging{transition:none}
.sheet.closing{transform:translateY(105%)!important}
.scrim{transition:opacity .3s ease}

    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="3"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </defs>
</svg>

<div id="sheetRoot"></div>
<div id="print"></div>

<script>
/* ================= الحالة ================= */
const S = { settings:null, books:[], loans:null, view:"catalog", q:"", status:"", cat:"", user:null, pin:null, scanner:null, installEvt:null, offline:false, reqs:null, fromReq:null, layout:"grid", preview:false };
try{ if(localStorage.getItem("lib_layout")==="rows") S.layout="rows" }catch{}
try{ const a=JSON.parse(localStorage.getItem("lib_auth")||"null"); if(a){S.user=a.user;S.pin=a.pin} }catch{}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const days=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const fmt=s=>{if(!s)return"";const[y,m,d]=s.split("-");return `${+d}/${+m}/${y}`};
const staff=()=>!!S.user&&!S.preview;
const bookUrl=n=>(S.settings?.appUrl||location.origin+location.pathname)+"?b="+encodeURIComponent(n);
const icon=(id,cls="ico")=>`<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const PALS=["c-blue","c-violet","c-green","c-sun"];
const catPal=c=>{const i=(S.settings?.categories||[]).indexOf(c);return i<0?"c-blue":PALS[i%PALS.length]};
const norm=s=>String(s||"").toLowerCase().replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim();
/* كتاب يطابق إن بدأ العنوان أو المؤلف (أو إحدى كلماتهما) بما كُتب؛ الأمين يبحث بالرقم أيضاً */
function matches(b,q,withNum){
  q=norm(q); if(!q) return true;
  const fields=[b.title,b.author].concat(withNum?[b.num]:[]).map(norm);
  return fields.some(f=>f.startsWith(q)||f.split(/\s+/).some(w=>w.startsWith(q)||(w.startsWith("ال")&&w.slice(2).startsWith(q))));
}
/* الهاتف: 10 أرقام تبدأ بـ 05 أو 06 أو 07 */
const phoneDigits=v=>String(v||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g,"");
const phoneOk=v=>/^0[567]\d{8}$/.test(phoneDigits(v));
function phoneHint(inp){
  const note=inp.parentElement.querySelector(".fieldnote"), d=phoneDigits(inp.value), req=inp.required;
  let msg="",cls="";
  if(!d){msg=req?"":"";}
  else if(!/^0/.test(d)||(d.length>=2&&!/^0[567]/.test(d))) {msg="يجب أن يبدأ الرقم بـ 05 أو 06 أو 07";cls="bad"}
  else if(d.length<10){msg=`${d.length} من 10 أرقام`;cls="bad"}
  else if(d.length>10){msg="الرقم أطول من 10 أرقام";cls="bad"}
  else {msg="✓ رقم صحيح";cls="ok"}
  if(note){note.textContent=msg;note.className="fieldnote "+cls}
  inp.classList.toggle("bad",cls==="bad");inp.classList.toggle("good",cls==="ok");
}
const AR_DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const AR_MONTHS=["جانفي","فيفري","مارس","أفريل","ماي","جوان","جويلية","أوت","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function addMonths(s,n){const d=new Date(s+"T12:00:00"),day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()<day)d.setDate(0);return d.toISOString().slice(0,10)}
function dueCard(out,due){
  if(!due) return "";
  const d=new Date(due+"T12:00:00"), n=days(out,due);
  return `<div class="duecard"><div class="d"><b>${d.getDate()}</b><small>${AR_MONTHS[d.getMonth()]}</small></div>
    <div class="tx"><span>يعود الكتاب قبل</span><b>${AR_DAYS[d.getDay()]} ${d.getDate()} ${AR_MONTHS[d.getMonth()]} ${d.getFullYear()}</b><span>مدة الإعارة ${n} يوماً</span></div></div>`;
}
const initial=t=>(String(t||"؟").replace(/^(ال)/,"").trim()[0]||"؟");

/* ================= الوضع الليلي والنهاري ================= */
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("lib_theme",t)}catch{}
  document.querySelector('meta[name="theme-color"]').content=t==="dark"?"#0f141e":"#e9eef5"}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",e=>{let saved=null;try{saved=localStorage.getItem("lib_theme")}catch{};if(!saved)document.documentElement.dataset.theme=e.matches?"dark":"light"});

/* ================= الاتصال بقاعدة البيانات (Supabase) ================= */
let _sb=null;
function sb(){
  if(_sb) return _sb;
  if(!SB_URL||SB_URL.startsWith("PASTE")) throw new Error("لم يُضبط رابط Supabase في الملف بعد");
  if(typeof supabase==="undefined") throw new Error("تعذّر الاتصال بالخادم");
  return _sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
}
async function api(action,data={},asStaff=false){
  const p={...data}; if(asStaff){p.user=S.user;p.pin=S.pin}
  const {data:res,error}=await sb().rpc("lib_api",{p_action:action,p});
  if(error) throw new Error(/fetch|network/i.test(error.message)?"لا يوجد اتصال بالإنترنت":error.message);
  return res;
}
/* تحديث فوري: أي تغيير في الكتب أو أي إعارة أو طلب جديد يظهر مباشرة على كل الهواتف المفتوحة */
function live(){
  if(S._live) return;
  try{
    S._live=sb().channel("lib-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"books"},()=>liveRefresh())
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"events"},()=>liveRefresh())
      .subscribe();
  }catch{}
}
let _liveT=null;
function liveRefresh(){
  clearTimeout(_liveT);
  _liveT=setTimeout(async()=>{
    try{
      const before=newReqs();
      const j=await api("init"); S.settings=j.settings; S.books=j.books; S.offline=false;
      try{localStorage.setItem("lib_cache",JSON.stringify(j))}catch{}
      if(S.user) await loadLoans();
      if(S.user&&!S.preview&&newReqs()>before) toast("وصل طلب استعارة جديد");
      const a=document.activeElement, typing=a&&$("#main").contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName);
      if(S.view==="scan"||S.view==="data"||typing) S._dirty=true; else render();
    }catch{}
  },350);
}
document.addEventListener("focusout",()=>{if(S._dirty&&S.view!=="scan"&&S.view!=="data"){setTimeout(()=>{const a=document.activeElement;if(!(a&&$("#main").contains(a)&&/INPUT|SELECT/.test(a.tagName))){S._dirty=false;render()}},50)}});
async function load(){
  try{
    let j;
    try{ j=await api("init"); S.offline=false; try{localStorage.setItem("lib_cache",JSON.stringify(j))}catch{} }
    catch(e){ let c=null; try{c=JSON.parse(localStorage.getItem("lib_cache")||"null")}catch{}; if(!c) throw e; j=c; S.offline=true }
    S.settings=j.settings; S.books=j.books; document.title=S.settings.name;
    if(staff()&&!S.offline) await loadLoans();
    if(!S.offline) live();
    const qs=new URLSearchParams(location.search), v=qs.get("v"), b=qs.get("b");
    if(v&&["scan","out","add"].includes(v)&&(v==="scan"||staff())) S.view=v;
    render();
    if(b) openBook(b);
    const amin=qs.has("amin");
    if(amin&&!staff()) loginSheet();
    if(b||v||amin) history.replaceState(null,"",location.pathname);
  }catch(e){ $("#main").innerHTML=`<div class="empty"><b>تعذّر تحميل الفهرس</b>${esc(e.message)}</div>` }
}
async function loadLoans(){ try{ const [a,b]=await Promise.all([api("loans",{},true),api("requests",{},true)]); S.loans=a.loans; S.reqs=b.requests }catch(e){ if(/الرمز/.test(e.message)) logout(); } }
const newReqs=()=>(S.reqs||[]).filter(r=>r.status==="جديد").length;
async function refresh(){const j=await api("init");S.settings=j.settings;S.books=j.books;if(staff())await loadLoans();render()}

/* ================= العرض ================= */
function counts(){
  const c={all:S.books.length,av:0,out:0,bad:0,late:0};
  S.books.forEach(b=>{if(b.status==="متوفر")c.av++;else if(b.status==="معار")c.out++;else c.bad++});
  if(S.loans) c.late=S.loans.filter(l=>!l.ret&&l.due&&l.due<today()).length;
  return c;
}
function chrome(){
  const name=S.settings?.name||"المكتبة";
  $("#hello").innerHTML=staff()?`أهلاً، <b>${esc(S.user)}</b>`:"أهلاً بك";
  $("#sub").textContent=staff()?`أدِر ${name}`:`فهرس ${name}`;
  const w=$("#whoBtn"); w.hidden=!staff(); w.innerHTML=staff()?`${esc(initial(S.user))}<span class="plus">✓</span>`:"";
  document.querySelectorAll("[data-staff]").forEach(b=>b.hidden=!staff());
  $(".dock").hidden=!staff(); document.body.classList.toggle("guest",!staff()); document.body.classList.toggle("preview",S.preview);
  let pv=$("#pvBar"); if(S.preview&&!pv){pv=document.createElement("div");pv.id="pvBar";pv.className="pv";pv.innerHTML=`${icon("eye")}<span>تشاهد المكتبة كزائر</span><button id="exitPreview">رجوع لوضع الأمين</button>`;document.body.appendChild(pv)} else if(!S.preview&&pv) pv.remove();
  document.querySelectorAll(".dk").forEach(b=>b.setAttribute("aria-current",b.dataset.v===S.view||["labels","reports","reqs","data"].includes(S.view)&&b.dataset.v==="more"));
}
function render(){
  if(!staff()) S.view="catalog";
  if(S.view!=="scan") stopScan();
  const v={catalog,scan:scanView,out:outView,add:addView,labels:labelsView,reports:reportsView,reqs:reqsView,data:dataView}[S.view]||catalog;
  const m=$("#main"), changed=S._lastView!==S.view||S._lastStaff!==staff();
  m.innerHTML=v(); chrome();
  m.classList.toggle("noanim",!changed);
  if(changed){m.classList.remove("viewin");void m.offsetWidth;m.classList.add("viewin")}
  S._lastView=S.view; S._lastStaff=staff();
  if(S.view==="scan") startScan();
  if(S.view==="labels") drawLabelPreview();
}

/* القرص: نسبة الكتب على الرفوف */
function dial(c){
  const R=86, C=2*Math.PI*R, SW=300, sweep=C*SW/360, tot=Math.max(1,c.all);
  const la=sweep*c.av/tot, lo=sweep*c.out/tot;
  const pct=c.all?Math.round(c.av*100/c.all):0;
  const ang=a=>(120+a)*Math.PI/180, pt=(a,r)=>[120+r*Math.cos(ang(a)),120+r*Math.sin(ang(a))];
  let ticks="";
  for(let i=0;i<=30;i++){const a=SW*i/30,big=i%15===0,[x1,y1]=pt(a,big?104:107),[x2,y2]=pt(a,114);ticks+=`<line class="tick ${big?"big":""}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}
  const [kx,ky]=pt(SW*c.av/tot,R), [lx0,ly0]=pt(0,128), [lx1,ly1]=pt(SW,128), [lxm,lym]=pt(SW/2,126);
  return `<div class="dial" role="img" aria-label="${pct}% من الكتب على الرفوف">
   <svg viewBox="0 0 240 240">${ticks}
    <text class="lbl" x="${lx0-6}" y="${ly0+4}" text-anchor="middle">0</text>
    <text class="lbl" x="${lx1+6}" y="${ly1+4}" text-anchor="middle">${c.all}</text>
    <text class="lbl" x="${lxm}" y="${lym-2}" text-anchor="middle">${Math.round(c.all/2)}</text>
    <circle class="track" cx="120" cy="120" r="${R}" stroke-width="16" stroke-dasharray="${sweep} ${C}" transform="rotate(120 120 120)" stroke-linecap="round"/>
    ${lo>0?`<circle cx="120" cy="120" r="${R}" fill="none" stroke="url(#gLent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${lo} ${C}" stroke-dashoffset="${-la}" transform="rotate(120 120 120)"/>`:""}
    ${la>0?`<circle cx="120" cy="120" r="${R}" fill="none" stroke="url(#gAvail)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${la} ${C}" transform="rotate(120 120 120)"/>`:""}
    ${c.all?`<circle cx="${kx}" cy="${ky}" r="11" fill="var(--card)" style="filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))"/><circle cx="${kx}" cy="${ky}" r="4" fill="url(#gAvail)"/>`:""}
   </svg>
   <div class="face"><b>${pct}<sup>%</sup></b><span>على الرفوف</span></div></div>`;
}
function filtered(){
  return S.books.filter(b=>(!S.status||(S.status==="غير متاح"?(b.status==="تالف"||b.status==="مفقود"):b.status===S.status))&&(!S.cat||b.category===S.cat)&&matches(b,S.q,staff()))
    .sort((a,b)=>a.title.localeCompare(b.title,"ar")||a.num.localeCompare(b.num));
}
/* واجهة الزائر: الكتب مباشرة */
function guestCatalog(){
  const c=counts(), list=filtered();
  const ms=(st,cls,ic,label,n)=>`<button class="ms ${cls}" data-status="${st}" aria-pressed="${S.status===st}"><i>${icon(ic)}</i><div><b>${n}</b><span>${label}</span></div></button>`;
  return `${S.offline?`<div class="offline">لا يوجد اتصال · تعرض آخر نسخة محفوظة من الفهرس</div>`:""}${installBanner()}
  <div class="searchbar">${icon("search")}<input id="q" type="search" placeholder="ابحث بعنوان الكتاب أو اسم المؤلف" value="${esc(S.q)}" autocomplete="off"></div>
  <div class="cats">${["",...S.settings.categories].map(x=>`<button class="cat" data-cat="${esc(x)}" aria-pressed="${S.cat===x}">${esc(x)||"الكل"}</button>`).join("")}</div>
  <div class="ministats" style="margin-top:8px">${ms("متوفر","c-blue","shelf","متوفر",c.av)}${ms("معار","c-violet","out","معار",c.out)}${ms("غير متاح","c-sun","warn","غير متاح",c.bad)}</div>
  <div class="sechead" style="margin-top:4px"><h2>${S.cat?esc(S.cat):`كل <em>الكتب</em>`}</h2>
    <div class="rt"><span>${list.length} كتاب</span><div class="seg" role="group" aria-label="طريقة العرض">
      <button data-layout="grid" aria-pressed="${S.layout==="grid"}" aria-label="بطاقات">${icon("grid")}</button>
      <button data-layout="rows" aria-pressed="${S.layout==="rows"}" aria-label="صفوف">${icon("rows")}</button></div></div></div>
  ${!S.books.length?`<div class="empty"><b>الفهرس فارغ</b>لم تُسجَّل كتب بعد.</div>`
   :list.length?(S.layout==="rows"?`<div class="rows">${list.map(bookRow).join("")}</div>`:`<div class="grid">${list.map(flipCard).join("")}</div>`):`<div class="empty"><b>لا نتائج</b>لا يوجد عنوان أو مؤلف يبدأ بـ «${esc(S.q)}».</div>`}`;
}
function flipCard(b){
  const lent=b.status==="معار", warn=b.status==="تالف"||b.status==="مفقود";
  const row=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:"";
  return `<div class="fc ${catPal(b.category)}" data-flip role="button" tabindex="0" aria-label="${esc(b.title)}، اضغط لعرض التفاصيل"><div class="fc-in">
    <div class="face2 bk front ${lent?"lent":""} ${warn?"warn":""}">
      <span class="st st-${esc(b.status)}" style="${lent?"background:rgba(255,255,255,.2);box-shadow:none;color:#fff":""}">${esc(b.status)}</span>
      <span class="ic">${esc(initial(b.title))}</span>
      <span class="t">${esc(b.title)}</span>
      <span class="m">${esc(b.author)||"—"}</span>
      <span class="hint">اضغط للتفاصيل ↻</span></div>
    <div class="face2 back"><h4>${esc(b.title)}</h4>
      <dl>${row("المؤلف",b.author)}${row("الدار",b.publisher)}${row("المترجم",b.translator)}${row("التصنيف",b.category)}<dt>الحالة</dt><dd>${esc(b.status)}</dd><dt>الرقم</dt><dd class="code">${esc(b.num)}</dd></dl>
      ${b.status==="متوفر"||b.status==="معار"?`<button class="reqbtn" data-req="${esc(b.num)}">اطلب هذا الكتاب</button>`:""}
      <div class="foot">الإعارة بموافقة أمين المكتبة بعد التحقق من حالة الكتاب.</div></div>
  </div></div>`;
}
function bookRow(b){
  const lent=b.status==="معار", row=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:"";
  return `<div class="rw ${catPal(b.category)} ${lent?"lent":""}">
    <button class="rw-h" data-expand aria-expanded="false"><span class="ic">${esc(initial(b.title))}</span>
      <span class="tx"><b>${esc(b.title)}</b><small>${esc(b.author)||"—"}</small></span>
      <span class="st st-${esc(b.status)}">${esc(b.status)}</span><svg class="ico chev"><use href="#i-chev"/></svg></button>
    <div class="rw-b"><div><div class="in">
      <dl>${row("دار النشر",b.publisher)}${row("المترجم",b.translator)}${row("التصنيف",b.category)}<dt>الرقم</dt><dd class="code">${esc(b.num)}</dd></dl>
      ${b.status==="متوفر"||b.status==="معار"?`<button class="btn sm ${catPal(b.category)}" data-req="${esc(b.num)}">اطلب هذا الكتاب</button>`:""}
      <p class="note">الإعارة بموافقة أمين المكتبة بعد التحقق من حالة الكتاب.</p>
    </div></div></div></div>`;
}
function catalog(){
  if(!staff()) return guestCatalog();
  const c=counts(), list=filtered();
  const tile=(st,cls,ic,label,n)=>`<button class="tile ${cls}" data-status="${st}" aria-pressed="${S.status===st}"><span class="ring">${icon(ic)}</span><b>${label}</b><small>${n} نسخة</small></button>`;
  return `${S.offline?`<div class="offline">لا يوجد اتصال · تعرض آخر نسخة محفوظة من الفهرس</div>`:""}${installBanner()}
  <div class="tiles">
    ${tile("متوفر","c-blue","shelf","متوفر",c.av)}
    ${tile("معار","c-violet","out","معار",c.out)}
    ${tile("غير متاح","c-sun","warn","غير متاح",c.bad)}
  </div>
  <section class="dialcard"><span class="notch">اليوم ${fmt(today())}</span>
    ${dial(c)}
    <div class="dialrow">
      <div><div class="big">${c.all}<small>نسخة</small></div><div class="lab">في المكتبة</div></div>
      <span class="pillsoft">${c.all?Math.round(c.out*100/c.all):0}% معار</span>
      <div class="end"><div class="big">${new Set(S.books.map(b=>b.title)).size}<small>عنوان</small></div><div class="lab">مختلف</div></div>
    </div>

async function readImport(file){
  if(!file) return;
  try{
    await needXLSX();
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    const name=wb.SheetNames.find(n=>norm(n)===norm("الكتب"))||wb.SheetNames[0];
    const raw=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:"",raw:false}).filter(r=>r.some(c=>String(c).trim()!==""));
    if(raw.length<2) throw new Error("الملف فارغ أو بلا سطور تحت العناوين");
    const keys=raw[0].map(keyOf);
    if(!keys.includes("title")) throw new Error("لم أجد عمود «العنوان». استعمل النموذج من التطبيق");
    S.impResult=null;
    S.imp={file:file.name,mode:S.imp?.mode||"add",rows:raw.slice(1).map((r,i)=>{const o={line:i+2};keys.forEach((k,ci)=>{if(k)o[k]=String(r[ci]??"").trim()});return o}),confirm:""};
    S.imp.ignored=raw[0].filter((h,i)=>String(h).trim()&&!keys[i]);
    validateImport(); render();
  }catch(e){toast(e.message,true)}
}
function validateImport(){
  const I=S.imp, have=new Set(S.books.map(b=>b.num.toUpperCase())), seen=new Map(), cats=new Set(S.settings.categories);
  I.rows.forEach(r=>{const n=(r.num||"").toUpperCase(); if(n) seen.set(n,(seen.get(n)||0)+1)});
  I.rows.forEach(r=>{
    r.st="ok"; r.msg=""; const n=(r.num||"").toUpperCase(), c=parseInt(String(r.copies||"").replace(/\D/g,""))||1;
    if(!r.title){r.st="bad";r.msg="العنوان فارغ";return}
    if(n&&seen.get(n)>1){r.st="bad";r.msg="الرقم مكرر داخل الملف";return}
    if(n&&have.has(n)){ if(I.mode==="add"){r.st="bad";r.msg="الرقم موجود مسبقاً";return} r.st="upd";r.msg="سيُحدَّث" }
    const w=[]; if(r.category&&!cats.has(r.category)) w.push("تصنيف جديد سيُضاف"); if(n&&c>1) w.push("الرقم محدد فتُنشأ نسخة واحدة"); if(r.copies&&!/^\d+$/.test(r.copies)) w.push("عدد النسخ غير رقمي (1)");
    if(!n&&c>1) r.msg=(r.msg?r.msg+" · ":"")+`${c} نسخ`;
    if(w.length){ if(r.st==="ok") r.st="warn"; r.msg=[r.msg,...w].filter(Boolean).join(" · ") }
  });
  const fileNums=new Set(I.rows.filter(r=>r.num&&r.st!=="bad").map(r=>r.num.toUpperCase()));
  I.willDelete=I.mode==="replace"?S.books.filter(b=>!fileNums.has(b.num.toUpperCase())):[];
  I.blocked=I.willDelete.filter(b=>b.status==="معار");
}
function dataView(){
  const I=S.imp;
  let imp="";
  if(I){

const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function sheet(html){
  const open=$(".sheet:not(.closing)");
  if(open){ /* تبديل المحتوى داخل نفس اللوحة دون إعادة الانزلاق */
    open.innerHTML=`<div class="grab"></div>${html}`; open.scrollTop=0; return;
  }
  $("#sheetRoot").innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
}
function closeSheet(){
  const sh=$(".sheet"), sc=$(".scrim"); if(!sh) return;
  if(reduceMotion()){ $("#sheetRoot").innerHTML=""; return; }
  sh.classList.remove("dragging"); sh.style.transform=""; sc&&(sc.style.opacity="");
  sh.classList.add("closing"); sc&&sc.classList.add("closing");
  setTimeout(()=>{ if(sh.isConnected) sh.parentElement.innerHTML=""; },300);
}
/* سحب اللوحة للأسفل لإغلاقها: تتبع الإصبع، وتُغلق إن سُحبت بعيداً أو بسرعة، وإلا ترجع لمكانها */
(()=>{
  let y0=0,t0=0,dy=0,active=false,sh=null,sc=null,fromGrab=false,yP=0,tP=0,vR=0;
  const start=(y,target)=>{
    sh=target.closest(".sheet"); if(!sh||sh.classList.contains("closing")) return;
    fromGrab=!!target.closest(".grab");
    if(!fromGrab&&(sh.scrollTop>0||target.closest("input,select,textarea,#reader,.imptab,.tw"))) {sh=null;return}
    sc=$(".scrim"); y0=yP=y; t0=tP=performance.now(); dy=0; vR=0; active=false;
  };
  const move=(y,e)=>{
    if(!sh) return;
    dy=y-y0; const now=performance.now(); if(now-tP>0){vR=.6*((y-yP)/(now-tP))+.4*vR} yP=y; tP=now;
    if(!active){ if(dy>6&&(fromGrab||sh.scrollTop<=0)){active=true;sh.classList.add("dragging")} else if(dy<-6){sh=null;return} else return; }
    if(e.cancelable) e.preventDefault();
    const d=Math.max(0,dy), pull=d<0?0:d;
    sh.style.transform=`translateY(${pull}px)`;
    if(sc) sc.style.opacity=String(Math.max(0,1-pull/(sh.offsetHeight*.9)));
  };
  const end=()=>{
    if(!sh) return;
    const v=Math.max(vR,dy/Math.max(1,performance.now()-t0)), h=sh.offsetHeight;
    sh.classList.remove("dragging");
    if(active&&(dy>Math.min(120,h*.25)||(dy>35&&v>.4))) closeSheet();
    else { sh.style.transform=""; if(sc) sc.style.opacity=""; }
    sh=null; active=false;
  };
  document.addEventListener("touchstart",e=>{if(e.touches.length===1)start(e.touches[0].clientY,e.target)},{passive:true});
  document.addEventListener("touchmove",e=>{if(e.touches.length===1)move(e.touches[0].clientY,e)},{passive:false});
  document.addEventListener("touchend",end); document.addEventListener("touchcancel",end);
  /* بالفأرة على الحاسوب: من مقبض اللوحة */
  document.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.target.closest(".grab")){start(e.clientY,e.target);const mm=ev=>move(ev.clientY,ev),mu=()=>{end();removeEventListener("pointermove",mm);removeEventListener("pointerup",mu)};addEventListener("pointermove",mm);addEventListener("pointerup",mu)}});
})();

  <div class="loans">${list.map(r=>{const bk=S.books.find(x=>x.num===r.num);return `<div class="req">
    <div class="hd"><div><b>${esc(r.title)}</b> <span class="code" style="color:var(--muted)">${esc(r.num)}</span><p>${bk?`الكتاب الآن: ${esc(bk.status)}`:""}</p></div><span class="rs ${RS[r.status]||"c-blue"}">${esc(r.status)}</span></div>
    <p><b style="color:var(--ink)">${esc(r.name)}</b> · <span dir="ltr">${esc(r.phone)}</span></p>
    <p><span class="forwho">${icon("user")}${!r.forWho||r.forWho==="لنفسه"?"الكتاب لصاحب الطلب نفسه":"الكتاب لـ: "+esc(r.forWho)}</span></p>
    ${r.note?`<p>${esc(r.note)}</p>`:""}<p>طُلب في ${esc(r.at)}${r.by?" · عالجه "+esc(r.by):""}</p>
    <div class="actions" style="margin-top:10px">
      ${r.status==="جديد"?`<button class="btn sm c-green" data-rq="${esc(r.id)}" data-st="مقبول">قبول</button><button class="btn sm flat" data-rq="${esc(r.id)}" data-st="مرفوض">رفض</button>`:""}
      ${r.status==="مقبول"&&bk&&bk.status==="متوفر"?`<button class="btn sm c-blue" data-rqlend="${esc(r.id)}">إعارة الآن</button>`:""}
      ${r.status==="مقبول"?`<button class="btn sm flat" data-rq="${esc(r.id)}" data-st="مرفوض">إلغاء</button>`:""}
    </div></div>`}).join("")}</div>`;
}
function loginSheet(){
  sheet(`<div class="hero c-violet"><span class="ic">${icon("user")}</span><div class="tx"><h2>دخول الأمين</h2><p class="by">الأسماء والرموز تُضبط في ورقة «الإعدادات».</p></div></div>
  <form class="form" id="loginForm">
    <label>الاسم<select id="g_user">${opts(S.settings?.staff||[])}</select></label>
    <label>الرمز السري<input id="g_pin" type="password" inputmode="numeric" required></label>
    <div class="actions"><button class="btn c-violet" type="submit">دخول</button><button class="btn flat" type="button" data-close>إلغاء</button></div></form>`);
}
function moreSheet(){
  const t=(v,cls,ic,l)=>`<button class="tile ${cls}" ${v}><span class="ring">${icon(ic)}</span><b>${l}</b></button>`;
  sheet(`<div class="sechead" style="margin-top:0"><h2>المزيد</h2></div><div class="more">
    ${t('id="shareLink"',"c-blue","share","مشاركة الرابط")}${t('id="viewGuest"',"c-violet","eye","عرض كزائر")}
    ${t('data-v="reqs"',"c-green","user","الطلبات").replace("</button>",newReqs()?`<span class="cnt">${newReqs()}</span></button>`:"</button>")}${t('data-v="labels"',"c-sun","label","الملصقات")}${t('data-v="reports"',"c-blue","chart","التقارير")}${t('data-v="data"',"c-green","grid","استيراد وتصدير")}${t('id="doLogout"',"c-violet","exit","خروج")}</div>`);
}
function logout(){S.user=S.pin=null;S.loans=null;try{localStorage.removeItem("lib_auth")}catch{};S.view="catalog";render()}

/* ================= التثبيت (PWA) ================= */
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function installBanner(){
  let hidden=false; try{hidden=localStorage.getItem("lib_noinstall")==="1"}catch{}
  if(isStandalone()||hidden) return "";
  if(S.installEvt) return `<div class="install"><img src="icons/icon-192.png" alt=""><div class="tx"><b>ثبّت المكتبة على هاتفك</b><span>تفتح كتطبيق مستقل وتعمل دون اتصال</span></div><button class="btn sm c-blue" id="doInstall">تثبيت</button><button class="x" id="noInstall" aria-label="إخفاء">×</button></div>`;
  if(isIOS()) return `<div class="install"><img src="icons/icon-192.png" alt=""><div class="tx"><b>ثبّت المكتبة على الآيفون</b><span>اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»</span></div><button class="x" id="noInstall" aria-label="إخفاء">×</button></div>`;
  return "";
}
/* دخول الأمين المخفي: ?amin في الرابط، أو 5 لمسات سريعة على التحية */
(()=>{let n=0,t=0;document.addEventListener("click",e=>{if(!e.target.closest("#hello")||staff())return;const now=Date.now();n=now-t<700?n+1:1;t=now;if(n>=5){n=0;loginSheet()}})})();
addEventListener("beforeinstallprompt",e=>{e.preventDefault();S.installEvt=e;if(S.settings&&S.view==="catalog")render()});
addEventListener("appinstalled",()=>{S.installEvt=null;toast("ثُبّت التطبيق");render()});
if("serviceWorker" in navigator&&isSecureContext){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));
  let reloaded=false; navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded)return;reloaded=true;location.reload()});
}

/* ================= المسح ================= */
function parseCode(text){try{const u=new URL(text);return u.searchParams.get("b")||text}catch{return text}}
async function startScan(){
  if(typeof Html5Qrcode==="undefined"){toast("تعذّر تحميل قارئ الكود",true);return}
  try{
    S.scanner=new Html5Qrcode("reader");
    await S.scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:230,height:230}},txt=>{
      const n=parseCode(txt); stopScan().then(()=>{S.view="catalog";render();openBook(n)});
    });
  }catch(e){toast("لم يُسمح بالكاميرا. اكتب الرقم يدوياً أو امسح بكاميرا الهاتف العادية.",true)}
}
async function stopScan(){const s=S.scanner;S.scanner=null;if(s){try{await s.stop();s.clear()}catch{}}}

/* ================= الأحداث ================= */
function toast(m,err){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),err?4200:2400)}
async function busy(form,fn){form.classList.add("loading");try{await fn()}catch(e){toast(e.message,true)}finally{form.classList.remove("loading")}}
const sheetNum=f=>f.closest(".sheet").querySelector("[data-num]").textContent;

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-v],[data-open],[data-status],[data-cat],[data-close],[data-lend],[data-return],[data-qrshow],[data-due],[data-req],[data-rq],[data-rqlend],[data-for],[data-months],[data-flip],[data-expand],[data-layout],[data-pick],#whoBtn,#themeBtn,#doLogout,#dlTpl,#doExport,[data-imode],#impCancel,#doImport,#printBatch,#shareLink,#viewGuest,#exitPreview,#copyLink,#nativeShare,#dlQr,#l_print,#l_today,#doInstall,#noInstall");
  if(!t) return; const d=t.dataset;
  if(d.req){requestSheet(d.req);return}
  if(d.rq){try{await api("setRequest",{id:d.rq,status:d.st},true);toast("الطلب: "+d.st);await loadLoans();render()}catch(err){toast(err.message,true)}return}
  if(d.rqlend){const r=S.reqs.find(x=>x.id===d.rqlend);lendSheet(r.num,{who:r.name,phone:r.phone,role:r.forWho&&r.forWho!=="لنفسه"?"لـ "+r.forWho:"",reqId:r.id});return}
  if(t.id==="dlTpl"){try{await downloadTemplate()}catch(err){toast(err.message,true)}return}
  if(t.id==="doExport"){try{await exportAll()}catch(err){toast(err.message,true)}return}
  if(d.imode){S.imp.confirm=$("#impConfirm")?.value||"";S.imp.mode=d.imode;validateImport();render();return}
  if(t.id==="impCancel"){S.imp=null;render();return}
  if(t.id==="doImport"){if(S.imp)S.imp.confirm=$("#impConfirm")?.value||"";await runImport(t);return}
  if(t.id==="printBatch"){S._labelNums=S.impResult.added.slice();S._labelsToday=false;S.view="labels";render();return}
  if(t.id==="shareLink"){shareSheet();return}
  if(t.id==="viewGuest"){closeSheet();S.preview=true;S.view="catalog";render();scrollTo({top:0});toast("هكذا يرى الزوار المكتبة");return}
  if(t.id==="exitPreview"){S.preview=false;render();toast("عدت إلى وضع الأمين");return}
  if(t.id==="copyLink"){const u=siteUrl();try{await navigator.clipboard.writeText(u);toast("نُسخ الرابط")}catch{const r=document.createRange();r.selectNodeContents($(".linkbox code"));getSelection().removeAllRanges();getSelection().addRange(r);toast("حدّد الرابط وانسخه يدوياً")}return}
  if(t.id==="nativeShare"){try{await navigator.share({title:S.settings.name,text:"تصفّح كتب "+S.settings.name+" واطلب الاستعارة:",url:siteUrl()})}catch{}return}
  if(t.id==="dlQr"){const c=qrPoster();if(!c)return toast("تعذّر تجهيز الصورة",true);const a=document.createElement("a");a.download="qr-"+S.settings.name+".png";a.href=c.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();return}
  if(d.for){t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));$("#q_other").hidden=d.for!=="other";if(d.for==="other")$("#q_for").focus();return}
  if(d.months!==undefined){t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));
    const out=$("#l_out").value||today();
    if(+d.months){$("#l_due").value=addMonths(out,+d.months);$("#dueBox").innerHTML=dueCard(out,$("#l_due").value)}
    else{$("#l_due").focus();try{$("#l_due").showPicker()}catch{}}
    return}
  if(d.flip!==undefined){t.classList.toggle("flip");return}
  if(d.expand!==undefined){const r=t.closest(".rw"),o=r.classList.toggle("open");t.setAttribute("aria-expanded",o);return}
  if(d.layout){S.layout=d.layout;try{localStorage.setItem("lib_layout",d.layout)}catch{};render();return}
  if(d.pick){await stopScan();S.view="catalog";render();openBook(d.pick);return}
  if(t.id==="doInstall"&&S.installEvt){S.installEvt.prompt();const r=await S.installEvt.userChoice;S.installEvt=null;if(r.outcome!=="accepted")render();return}
  if(t.id==="noInstall"){try{localStorage.setItem("lib_noinstall","1")}catch{};render();return}
  if(t.id==="themeBtn"){setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");return}
  if(t.id==="whoBtn"){staff()?moreSheet():loginSheet();return}
  if(t.id==="doLogout"){closeSheet();logout();toast("تم الخروج");return}
  if(d.v==="more"){moreSheet();return}
  if(d.v){closeSheet();S.view=d.v;render();scrollTo({top:0,behavior:"smooth"})}
  else if(d.open!==undefined) openBook(d.open);
  else if(d.status!==undefined){S.status=S.status===d.status?"":d.status;render()}
  else if(d.cat!==undefined){S.cat=d.cat;render()}
  else if(d.close!==undefined) closeSheet();
  else if(d.lend) lendSheet(d.lend);
  else if(d.return) returnSheet(d.return);
  else if(d.due) $("#l_due").value=addDays($("#l_out").value||today(),+d.due);
  else if(d.qrshow){const slot=$("#qrSlot");slot.innerHTML=`<div class="qrbox"><div class="q" data-qr="${esc(d.qrshow)}"></div><div style="min-width:0"><b class="code">${esc(d.qrshow)}</b><p class="by" style="overflow-wrap:anywhere;direction:ltr">${esc(bookUrl(d.qrshow))}</p></div></div>`;fillQR(slot,120)}
  else if(t.id==="l_today"){S._labelNums=null;S._labelsToday=!S._labelsToday;t.textContent=S._labelsToday?"كل النطاق":"المضافة اليوم فقط";drawLabelPreview()}
  else if(t.id==="l_print"){const bs=labelBooks();if(!bs.length)return toast("لا كتب للطباعة",true);const p=$("#print");p.innerHTML=bs.map(labelHtml).join("");fillQR(p,110);setTimeout(()=>window.print(),300)}
});
document.addEventListener("change",e=>{if(e.target.id==="impFile"){readImport(e.target.files[0]);return}if(e.target.id==="l_from"||e.target.id==="l_to")S._labelNums=null;if(e.target.id==="l_due"||e.target.id==="l_out"){const o=$("#l_out").value||today(),u=$("#l_due").value;if(e.target.id==="l_out"){const p=document.querySelector(".durs [aria-pressed=true]");if(p&&+p.dataset.months)$("#l_due").value=addMonths(o,+p.dataset.months)}else document.querySelectorAll(".durs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.months==="0"));$("#dueBox").innerHTML=u&&$("#l_due").value>=o?dueCard(o,$("#l_due").value):`<div class="callout sun">تاريخ الإرجاع يجب أن يكون بعد تاريخ الإعارة</div>`;return}
  if(e.target.id==="l_from"||e.target.id==="l_to"){S._labelsToday=false;drawLabelPreview()}});
function manualResults(){
  const q=$("#mnum").value, box=$("#mres"); if(!box) return;
  if(!norm(q)){box.innerHTML="";return}
  const list=S.books.filter(b=>matches(b,q,true)).slice(0,8);
  box.innerHTML=list.length?list.map(b=>`<button class="mr ${catPal(b.category)}" data-pick="${esc(b.num)}"><span class="ic">${esc(initial(b.title))}</span><span class="tx"><b>${esc(b.title)}</b><small>${esc(b.author)||"—"} · <span class="code">${esc(b.num)}</span></small></span><span class="st st-${esc(b.status)}">${esc(b.status)}</span></button>`).join("")
    :`<div class="empty" style="padding:18px">لا يوجد كتاب يبدأ بـ «${esc(q)}»</div>`;
}
document.addEventListener("input",e=>{if(e.target.matches?.("[data-phone]")){phoneHint(e.target);return}if(e.target.id==="mnum"){manualResults();return}if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches?.("[data-flip]")){e.preventDefault();e.target.classList.toggle("flip");return}if(e.key==="Escape")closeSheet();if(e.key==="Enter"&&e.target.id==="q"){const v=e.target.value.trim();const hit=S.books.find(b=>b.num.toUpperCase()===v.toUpperCase());if(hit)openBook(hit.num)}});
document.addEventListener("submit",async e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==="manual"){const v=$("#mnum").value.trim();const hit=S.books.find(b=>b.num.toUpperCase()===v.toUpperCase())||S.books.find(b=>matches(b,v,true));if(!hit)return toast("لا يوجد كتاب مطابق",true);await stopScan();S.view="catalog";render();openBook(hit.num)}
  else if(f.id==="reqForm") busy(f,async()=>{
    if(!phoneOk($("#q_phone").value)){phoneHint($("#q_phone"));$("#q_phone").focus();throw new Error("رقم الهاتف: 10 أرقام تبدأ بـ 05 أو 06 أو 07")}
    const other=!$("#q_other").hidden, forName=$("#q_for").value.trim(), cls=$("#q_class").value.trim();
    if(other&&!forName){$("#q_for").focus();throw new Error("اكتب اسم الشخص الذي سيأخذ الكتاب")}
    const forWho=other?[forName,cls].filter(Boolean).join(" - "):"لنفسه";
    await api("request",{num:sheetNum(f),name:$("#q_name").value,phone:phoneDigits($("#q_phone").value),forWho,note:$("#q_note").value,website:$("#q_web").value});
    requestDone();
  });
  else if(f.id==="loginForm") busy(f,async()=>{
    const user=$("#g_user").value,pin=$("#g_pin").value;
    await api("login",{user,pin}); S.user=user;S.pin=pin; try{localStorage.setItem("lib_auth",JSON.stringify({user,pin}))}catch{}
    closeSheet(); await loadLoans(); render(); toast("مرحباً "+user);
  });
  else if(f.id==="lendForm") busy(f,async()=>{
    const num=sheetNum(f);
    if($("#l_phone").value.trim()&&!phoneOk($("#l_phone").value)){phoneHint($("#l_phone"));$("#l_phone").focus();throw new Error("رقم الهاتف: 10 أرقام تبدأ بـ 05 أو 06 أو 07")}
    if($("#l_due").value&&$("#l_due").value<($("#l_out").value||today())) throw new Error("تاريخ الإرجاع قبل تاريخ الإعارة");
    await api("lend",{num,borrower:$("#l_who").value,phone:phoneDigits($("#l_phone").value),role:$("#l_role").value,out:$("#l_out").value,due:$("#l_due").value,note:$("#l_note").value},true);
    if(S.fromReq){try{await api("setRequest",{id:S.fromReq,status:"سُلّم"},true)}catch{};S.fromReq=null}
    closeSheet(); toast("سُجّلت الإعارة"); await refresh(); openBook(num);
  });
  else if(f.id==="retForm") busy(f,async()=>{
    const num=sheetNum(f);
    const j=await api("returnBook",{num,ret:$("#r_date").value,cond:$("#r_cond").value,note:$("#r_note").value},true);
    closeSheet(); toast("عاد الكتاب · الحالة: "+j.status); await refresh();
  });
  else if(f.id==="addForm") busy(f,async()=>{
    const book={title:$("#a_title").value,author:$("#a_author").value,publisher:$("#a_pub").value,translator:$("#a_tr").value,
      category:$("#a_cat").value,owner:$("#a_owner").value,library:$("#a_lib").value,copies:$("#a_copies").value,num:$("#a_num").value,note:$("#a_note").value};
    const j=await api("addBook",{book},true); await refresh();
    S.view="add"; render();
    const r=$("#addResult"); r.innerHTML=`<div class="callout violet" style="margin-top:16px">أُضيف <b>${esc(book.title)}</b> بالأرقام: ${j.added.map(n=>`<span class="code">${esc(n)}</span>`).join("، ")}</div>
      <div id="preview">${j.added.map(n=>labelHtml({num:n,title:book.title})).join("")}</div>
      <div class="actions"><button class="btn c-sun" data-v="labels">${icon("label")}طباعة الملصقات</button></div>`; fillQR(r,96); toast("أُضيف الكتاب");
  });
});

load();
</script>
</body>
</html>
